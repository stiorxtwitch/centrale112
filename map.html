<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Dispatch — Los Santos</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#020609;--panel:#06101a;--panel2:#0b1825;
  --border:#142030;--border2:#1c3048;
  --police:#3b9eff;--fire:#ff4040;--amb:#00d4a0;
  --txt:#b0c8e4;--txt2:#527090;--txt3:#2e4a66;
  --gold:#ffb800;--red:#ff3333;
}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',sans-serif;background:#0a0a0a;color:var(--txt)}
.topbar{height:46px;background:var(--panel);border-bottom:1px solid var(--border2);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0}
.logo{width:32px;height:32px;background:linear-gradient(135deg,#cc1111,#880000);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#fff;flex-shrink:0}
.brand{font-size:11px;font-weight:700;letter-spacing:2px;color:#fff}
.brand-sub{font-size:8px;color:var(--txt2);letter-spacing:1.5px}
.stats{display:flex;gap:4px;flex:1;justify-content:center}
.st{padding:3px 10px;border-radius:3px;border:1px solid var(--border2);text-align:center;min-width:60px}
.st-v{font-size:15px;font-weight:700;line-height:1;font-family:monospace}
.st-l{font-size:7px;color:var(--txt2);letter-spacing:1px;text-transform:uppercase}
.clock{font-family:monospace;font-size:16px;color:var(--gold);letter-spacing:2px;flex-shrink:0}
.dot{width:6px;height:6px;border-radius:50%;background:var(--amb);box-shadow:0 0 6px var(--amb);animation:blink 1.4s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,50,50,.8)}50%{box-shadow:0 0 0 12px rgba(255,50,50,0)}}
.pulse-anim{animation:pulse 1.5s infinite}
.nav{height:34px;background:var(--panel2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 6px;gap:4px;flex-shrink:0}
.nav-tab{padding:3px 12px;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt2);border:none;background:transparent;cursor:pointer;border-radius:3px;transition:all .12s;border-bottom:2px solid transparent}
.nav-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.nav-tab:hover{color:var(--txt)}
.nbadge{background:var(--red);color:#fff;border-radius:8px;padding:0 4px;font-size:7px;line-height:12px;margin-left:3px}
.btn-reset{margin-left:auto;padding:3px 8px;font-size:8px;font-weight:700;letter-spacing:1px;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--txt3);text-transform:uppercase;border-radius:2px;transition:all .15s}
.btn-reset:hover{border-color:var(--red);color:var(--red)}
.layout{display:flex;height:calc(100vh - 80px)}
#map{flex:1;z-index:1;background:#0a0c10;position:relative}
#map.placing{cursor:crosshair!important}
#banner{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:2000;display:none;background:rgba(2,6,9,.97);border:1px solid var(--gold);border-radius:5px;padding:8px 14px;text-align:center;min-width:300px;box-shadow:0 0 30px rgba(255,184,0,.15)}
#banner.show{display:block}
.bn-title{font-size:9px;color:var(--gold);letter-spacing:2px;margin-bottom:3px;font-weight:700;text-transform:uppercase}
.bn-sub{font-size:10px;color:var(--txt2);margin-bottom:6px}
.bn-btns{display:flex;gap:6px;justify-content:center}
.sidebar{width:250px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sb-filters{padding:5px;display:flex;gap:3px;background:var(--panel2);border-bottom:1px solid var(--border);flex-shrink:0}
.sf{flex:1;padding:3px;font-size:8px;font-weight:700;letter-spacing:1px;border-radius:2px;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--txt2);text-transform:uppercase;transition:all .12s;text-align:center}
.sf.on{border-color:var(--gold);color:var(--gold);background:rgba(255,184,0,.07)}
.sb-sec{display:flex;flex-direction:column;border-bottom:1px solid var(--border)}
.sb-sec.grow{flex:1;overflow:hidden}
.sb-hdr{padding:5px 10px;font-size:7px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--txt3);background:var(--panel2);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.sb-cnt{background:var(--border2);color:var(--txt2);border-radius:8px;padding:0 5px;font-size:7px}
.sb-list{overflow-y:auto;flex:1}
.sb-list::-webkit-scrollbar{width:2px}
.sb-list::-webkit-scrollbar-thumb{background:var(--border2)}
.sb-empty{padding:14px;text-align:center;color:var(--txt3);font-size:8px;letter-spacing:1px;text-transform:uppercase;line-height:2}
.sb-item{padding:6px 10px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .1s}
.sb-item:hover{background:var(--panel2)}
.sb-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sb-info{flex:1;min-width:0}
.sb-name{font-size:10px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-sub{font-size:8px;color:var(--txt2);margin-top:1px}
.sb-tag{font-size:7px;font-weight:700;padding:2px 4px;border-radius:2px;white-space:nowrap;letter-spacing:.5px}
.tag-dispo{background:rgba(0,212,160,.1);color:var(--amb);border:1px solid rgba(0,212,160,.2)}
.tag-dep{background:rgba(255,64,64,.1);color:var(--fire);border:1px solid rgba(255,64,64,.2)}
.tag-route{background:rgba(255,184,0,.1);color:var(--gold);border:1px solid rgba(255,184,0,.2);animation:blink .8s infinite}
.sb-actions{padding:7px;flex-shrink:0;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:4px}
.btn{padding:6px 12px;border-radius:3px;font-family:inherit;font-size:9px;font-weight:700;letter-spacing:1.5px;cursor:pointer;border:none;text-transform:uppercase;transition:all .15s}
.btn-primary{background:var(--gold);color:#000}
.btn-primary:hover{filter:brightness(1.15)}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--txt2)}
.btn-ghost:hover{border-color:var(--txt);color:var(--txt)}
.btn-danger{background:transparent;border:1px solid var(--red);color:var(--red)}
.btn-danger:hover{background:rgba(255,51,51,.12)}
.btn-ok{background:transparent;border:1px solid var(--amb);color:var(--amb)}
.btn-ok:hover{background:rgba(0,212,160,.1)}
.btn-w{width:100%}
.btn-sm{padding:3px 8px;font-size:8px}
.modal-ov{position:fixed;inset:0;background:rgba(2,6,9,.92);z-index:3000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-ov.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--border2);border-radius:6px;width:460px;max-height:85vh;overflow-y:auto}
.mh{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--panel2);position:sticky;top:0;z-index:2}
.mh-t{font-size:10px;font-weight:700;letter-spacing:2px;color:#fff;text-transform:uppercase}
.mh-x{background:none;border:none;color:var(--txt2);font-size:15px;cursor:pointer;padding:2px 5px;border-radius:2px}
.mh-x:hover{color:#fff;background:rgba(255,255,255,.08)}
.mb{padding:12px}
.mf{padding:8px 12px;border-top:1px solid var(--border);display:flex;gap:6px;justify-content:flex-end;background:var(--panel2)}
.fg{margin-bottom:10px}
.fl{font-size:7px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt2);margin-bottom:3px;display:block}
.fi,.fs,.ft{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:3px;padding:6px 9px;color:var(--txt);font-family:inherit;font-size:11px;outline:none;transition:border-color .12s}
.fi:focus,.fs:focus,.ft:focus{border-color:var(--gold)}
.ft{resize:vertical;min-height:50px}
.fs option{background:var(--panel2)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pos-b{display:flex;align-items:center;gap:6px;padding:6px 9px;background:rgba(0,212,160,.05);border:1px solid rgba(0,212,160,.2);border-radius:3px;font-family:monospace;font-size:9px;color:var(--amb)}
.unit-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:3px}
.ug-item{padding:5px 7px;border:1px solid var(--border2);border-radius:3px;cursor:pointer;display:flex;align-items:center;gap:5px;font-size:9px;transition:all .12s}
.ug-item.sel{border-color:var(--gold);background:rgba(255,184,0,.06)}
.uc{font-size:7px;font-weight:700;padding:1px 4px;border-radius:2px;letter-spacing:.5px;white-space:nowrap}
.uc-p{background:rgba(59,158,255,.12);color:var(--police);border:1px solid rgba(59,158,255,.2)}
.uc-f{background:rgba(255,64,64,.12);color:var(--fire);border:1px solid rgba(255,64,64,.2)}
.uc-a{background:rgba(0,212,160,.12);color:var(--amb);border:1px solid rgba(0,212,160,.2)}
.notifs{position:fixed;top:90px;right:10px;z-index:9999;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.notif{padding:7px 11px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:.5px;min-width:210px;border-left:3px solid;animation:slideIn .2s ease;text-transform:uppercase}
@keyframes slideIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
.n-ok{background:rgba(0,212,160,.1);border-color:var(--amb);color:var(--amb)}
.n-err{background:rgba(255,51,51,.1);border-color:var(--red);color:var(--red)}
.n-info{background:rgba(59,158,255,.1);border-color:var(--police);color:var(--police)}
.n-warn{background:rgba(255,184,0,.1);border-color:var(--gold);color:var(--gold)}
.leaflet-popup-content-wrapper{background:rgba(6,16,26,.98)!important;border:1px solid var(--border2)!important;border-radius:4px!important;color:var(--txt)!important;box-shadow:0 8px 24px rgba(0,0,0,.9)!important}
.leaflet-popup-tip{background:rgba(6,16,26,.98)!important}
.leaflet-popup-content{margin:8px 12px!important;font-family:inherit!important}
.leaflet-control-zoom a{background:var(--panel2)!important;color:var(--txt)!important;border-bottom:1px solid var(--border)!important}
.leaflet-control-zoom a:hover{background:var(--panel)!important;color:#fff!important}
.leaflet-control-attribution{background:rgba(2,6,9,.8)!important;color:var(--txt3)!important;font-size:7px!important}
.pp-btn{padding:3px 7px;font-size:8px;border-radius:2px;cursor:pointer;font-family:inherit;font-weight:700;letter-spacing:.5px;border:1px solid;transition:all .12s}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">LSPD</div>
  <div>
    <div class="brand">DISPATCH CENTER</div>
    <div class="brand-sub">LOS SANTOS · SAN ANDREAS</div>
  </div>
  <div class="stats">
    <div class="st"><div class="st-v" id="st-active" style="color:var(--red)">0</div><div class="st-l">Incidents</div></div>
    <div class="st"><div class="st-v" id="st-dispo" style="color:var(--amb)">0</div><div class="st-l">Dispos</div></div>
    <div class="st"><div class="st-v" id="st-route" style="color:var(--gold)">0</div><div class="st-l">En route</div></div>
  </div>
  <div class="clock" id="clock">00:00:00</div>
  <div class="dot"></div>
</div>

<div class="nav">
  <button class="nav-tab active">▦ CARTE</button>
  <button class="nav-tab">⚑ INTERVENTIONS <span class="nbadge" id="nav-inc-badge">0</span></button>
  <button class="nav-tab">⬡ PATROUILLES <span class="nbadge" id="nav-pat-badge">0</span></button>
  <button class="btn-reset" onclick="resetAll()">RÉINIT</button>
</div>

<div class="layout">
  <div style="flex:1;position:relative">
    <div id="map"></div>
    <div id="banner">
      <div class="bn-title" id="bn-title">PLACEMENT</div>
      <div class="bn-sub" id="bn-sub">Cliquez sur la carte</div>
      <div class="bn-btns" id="bn-btns">
        <button class="btn btn-danger btn-sm" onclick="cancelPlacing()">✕ ANNULER</button>
      </div>
    </div>
  </div>
  <div class="sidebar">
    <div class="sb-filters">
      <button class="sf on" onclick="setFilter('all',this)">TOUS</button>
      <button class="sf" onclick="setFilter('police',this)">POL</button>
      <button class="sf" onclick="setFilter('fire',this)">FEU</button>
      <button class="sf" onclick="setFilter('ambulance',this)">MED</button>
    </div>
    <div class="sb-sec" style="max-height:190px">
      <div class="sb-hdr">⚑ INCIDENTS <span class="sb-cnt" id="cnt-inc">0</span></div>
      <div class="sb-list" id="list-inc"><div class="sb-empty">Aucun incident actif</div></div>
    </div>
    <div class="sb-sec grow">
      <div class="sb-hdr">⬡ UNITÉS <span class="sb-cnt" id="cnt-units">0</span></div>
      <div class="sb-list" id="list-units"><div class="sb-empty">Aucune unité</div></div>
    </div>
    <div class="sb-actions">
      <button class="btn btn-primary btn-w" onclick="startNewIncident()">+ NOUVEL INCIDENT</button>
      <button class="btn btn-ghost btn-w" onclick="startNewUnit()">+ AJOUTER PATROUILLE</button>
    </div>
  </div>
</div>

<div class="notifs" id="notifs"></div>

<!-- MODAL INCIDENT -->
<div class="modal-ov" id="modal-inc">
  <div class="modal">
    <div class="mh"><span class="mh-t" id="inc-modal-title">NOUVEL INCIDENT</span><button class="mh-x" onclick="closeIncModal()">✕</button></div>
    <div class="mb">
      <div class="fg"><label class="fl">Position</label><div class="pos-b">📍 <span id="inc-pos-display">—</span></div></div>
      <div id="inc-form-fields">
        <div class="frow">
          <div class="fg"><label class="fl">Type</label>
            <select class="fs" id="f-type">
              <option>Accident de la route</option><option>Fusillade</option>
              <option>Vol en cours</option><option>Poursuite</option>
              <option>Incendie</option><option>Urgence médicale</option>
              <option>Agression</option><option>Braquage</option><option>Autre</option>
            </select>
          </div>
          <div class="fg"><label class="fl">Priorité</label>
            <select class="fs" id="f-prio">
              <option value="1">CODE 3 — CRITIQUE</option>
              <option value="2">CODE 2 — URGENT</option>
              <option value="3">CODE 1 — ROUTINE</option>
            </select>
          </div>
        </div>
        <div class="fg"><label class="fl">Description</label><textarea class="ft" id="f-desc" placeholder="Détails…"></textarea></div>
      </div>
      <div class="fg"><label class="fl">Patrouilles à dépêcher</label>
        <div class="unit-grid" id="f-units"><p style="color:var(--txt2);font-size:9px;padding:5px 0;grid-column:1/-1">Aucune patrouille disponible</p></div>
      </div>
    </div>
    <div class="mf">
      <button class="btn btn-ghost" onclick="closeIncModal()">ANNULER</button>
      <button class="btn btn-primary" id="btn-create-inc" onclick="createIncident()">CRÉER + DISPATCHER</button>
    </div>
  </div>
</div>

<!-- MODAL PATROUILLE -->
<div class="modal-ov" id="modal-unit">
  <div class="modal">
    <div class="mh"><span class="mh-t">NOUVELLE PATROUILLE</span><button class="mh-x" onclick="closeModal('modal-unit')">✕</button></div>
    <div class="mb">
      <div class="fg"><label class="fl">Position</label><div class="pos-b">📍 <span id="unit-pos-display">—</span></div></div>
      <div class="frow">
        <div class="fg"><label class="fl">Indicatif</label><input class="fi" id="u-id" placeholder="Ex: LSPD-01"/></div>
        <div class="fg"><label class="fl">Type</label>
          <select class="fs" id="u-type">
            <option value="police">Police (LSPD)</option>
            <option value="fire">Pompiers (LSFD)</option>
            <option value="ambulance">EMS / Ambulance</option>
          </select>
        </div>
      </div>
      <div class="fg"><label class="fl">Nom</label><input class="fi" id="u-name" placeholder="Ex: Patrouille Downtown"/></div>
    </div>
    <div class="mf">
      <button class="btn btn-ghost" onclick="closeModal('modal-unit')">ANNULER</button>
      <button class="btn btn-primary" onclick="createUnit()">AJOUTER</button>
    </div>
  </div>
</div>

<script>
// ── STORAGE (localStorage avec préfixe) ──
const S={
  get:k=>{try{return JSON.parse(localStorage.getItem('gtav_'+k))}catch{return null}},
  set:(k,v)=>{localStorage.setItem('gtav_'+k,JSON.stringify(v));localStorage.setItem('gtav_ts',Date.now())}
};
function initData(){
  if(!S.get('units'))     S.set('units',[]);
  if(!S.get('incidents')) S.set('incidents',[]);
}
function resetAll(){
  if(!confirm('Supprimer toutes les données ?')) return;
  Object.keys(localStorage).filter(k=>k.startsWith('gtav_')).forEach(k=>localStorage.removeItem(k));
  Object.values(routeLines).forEach(l=>{try{map.removeLayer(l)}catch{}});
  animations={};routeLines={};
  initData();renderMap();notify('Données réinitialisées','ok');
}

// ── CLOCK ──
setInterval(()=>{
  const n=new Date();
  document.getElementById('clock').textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':');
},1000);

// ── MAP ──
// La carte GTA V satellite fait 2048x2048 px.
// On utilise CRS.Simple. On mappe l'image entière sur les bounds [0,0] → [2048,2048].
// Leaflet CRS.Simple : y croît vers le haut, mais les images PNG ont y vers le bas.
// On utilise donc bounds = [[2048,0],[0,2048]] (coin haut-gauche = [2048,0], bas-droit = [0,2048])
// pour que l'image s'affiche dans le bon sens.

let map,uMarkers={},iMarkers={},routeLines={},animations={};
let filterType='all',lastTs=0;

const IMG_URL='https://www.bragitoff.com/wp-content/uploads/2015/11/GTAV_SATELLITE_2048x2048.png';
const IMG_SIZE=2048;

// Bounds : [SW, NE] en CRS.Simple = [[row_min, col_min],[row_max, col_max]]
// On veut que l'image remplisse [0,0] à [2048,2048] dans l'espace de la carte.
// SW = [0,0], NE = [2048, 2048]
// Leaflet ImageOverlay : bounds = [[lat_min,lng_min],[lat_max,lng_max]]
// Avec CRS.Simple : lat = y (vertical), lng = x (horizontal)
// Image PNG : origine en haut-gauche. On veut origine (0,0) = coin haut-gauche de la carte GTA.
// → lat_max = 2048 (haut), lat_min = 0 (bas), lng_min = 0 (gauche), lng_max = 2048 (droite)
const BOUNDS = [[0,0],[IMG_SIZE,IMG_SIZE]];

// Centre du jeu (Los Santos downtown ≈ centre de la carte)
// D'après la carte satellite GTA V 2048x2048 :
// Los Santos Downtown ≈ pixel (1200, 1700) depuis le coin haut-gauche
// En CRS.Simple (y inversé) : lat = 2048 - 1700 = 348, lng = 1200
const CENTER = [400, 1200];

function initMap(){
  map = L.map('map',{
    crs: L.CRS.Simple,
    minZoom: -2,
    maxZoom: 3,
    zoomControl: true,
    attributionControl: true
  });

  L.imageOverlay(IMG_URL, BOUNDS, {
    attribution: '© Rockstar Games — GTA V',
    opacity: 1,
    zIndex: 1
  }).addTo(map);

  // Contraindre la vue aux bounds de la carte
  map.setMaxBounds([[BOUNDS[0][0]-50, BOUNDS[0][1]-50],[BOUNDS[1][0]+50, BOUNDS[1][1]+50]]);
  map.fitBounds(BOUNDS);

  map.on('click', onMapClick);
}

// Coordonnées utiles (y inversé : lat = 2048 - pixel_y, lng = pixel_x)
// Pour mémoire : Los Santos Downtown ≈ lat=400, lng=1200

// ── PLACEMENT ──
let placingMode=null,placingMarker=null,pendingPos=null;

function onMapClick(e){
  if(!placingMode) return;
  if(placingMarker) map.removeLayer(placingMarker);
  placingMarker = L.marker([e.latlng.lat, e.latlng.lng],{
    draggable:true,
    icon: placingMode==='incident' ? makeIncPlacingIcon() : makeUnitPlacingIcon()
  }).addTo(map);
  pendingPos = [e.latlng.lat, e.latlng.lng];
  placingMarker.on('dragend',()=>{
    const p=placingMarker.getLatLng(); pendingPos=[p.lat,p.lng]; updateBannerConfirm();
  });
  updateBannerConfirm();
}

function makeIncPlacingIcon(){
  return L.divIcon({className:'',iconSize:[36,48],iconAnchor:[18,48],
    html:`<div style="position:relative;width:36px">
      <div class="pulse-anim" style="width:36px;height:36px;background:#ff2020;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;border:2px solid rgba(255,255,255,.9)">!</div>
      <div style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:11px solid #ff2020"></div>
    </div>`});
}
function makeUnitPlacingIcon(){
  return L.divIcon({className:'',iconSize:[34,46],iconAnchor:[17,46],
    html:`<div style="position:relative;width:34px">
      <div style="width:34px;height:34px;background:rgba(2,6,9,.97);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid #ffb800">📌</div>
      <div style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:12px solid #ffb800"></div>
    </div>`});
}

function updateBannerConfirm(){
  document.getElementById('bn-sub').textContent=`(${pendingPos[0].toFixed(0)}, ${pendingPos[1].toFixed(0)}) — Glissez pour ajuster`;
  document.getElementById('bn-btns').innerHTML=`
    <button class="btn btn-danger btn-sm" onclick="cancelPlacing()">✕ ANNULER</button>
    <button class="btn btn-ok btn-sm" onclick="confirmPlacing()">✓ CONFIRMER</button>`;
}

function startNewIncident(){
  cancelPlacing(); placingMode='incident';
  map.getContainer().classList.add('placing');
  document.getElementById('banner').classList.add('show');
  document.getElementById('bn-title').textContent='PLACEMENT INCIDENT';
  document.getElementById('bn-sub').textContent='Cliquez sur la carte GTA V';
  document.getElementById('bn-btns').innerHTML=`<button class="btn btn-danger btn-sm" onclick="cancelPlacing()">✕ ANNULER</button>`;
}
function startNewUnit(){
  cancelPlacing(); placingMode='unit';
  map.getContainer().classList.add('placing');
  document.getElementById('banner').classList.add('show');
  document.getElementById('bn-title').textContent='PLACEMENT PATROUILLE';
  document.getElementById('bn-sub').textContent='Cliquez sur la carte GTA V';
  document.getElementById('bn-btns').innerHTML=`<button class="btn btn-danger btn-sm" onclick="cancelPlacing()">✕ ANNULER</button>`;
}
function cancelPlacing(){
  placingMode=null; pendingPos=null;
  if(placingMarker){map.removeLayer(placingMarker);placingMarker=null;}
  map.getContainer().classList.remove('placing');
  document.getElementById('banner').classList.remove('show');
}
function confirmPlacing(){
  if(!pendingPos) return;
  const mode=placingMode, pos=[...pendingPos];
  placingMode=null;
  map.getContainer().classList.remove('placing');
  document.getElementById('banner').classList.remove('show');
  if(mode==='incident'){
    document.getElementById('inc-modal-title').textContent='NOUVEL INCIDENT';
    document.getElementById('inc-pos-display').textContent=`${pos[0].toFixed(0)}, ${pos[1].toFixed(0)}`;
    document.getElementById('inc-form-fields').style.display='';
    document.getElementById('btn-create-inc').textContent='CRÉER + DISPATCHER';
    document.getElementById('f-desc').value='';
    document.getElementById('f-type').selectedIndex=0;
    document.getElementById('f-prio').selectedIndex=0;
    window._renforcerInc=null;
    const avail=(S.get('units')||[]).filter(u=>u.status==='available');
    document.getElementById('f-units').innerHTML=avail.length
      ?avail.map(u=>`<div class="ug-item" onclick="this.classList.toggle('sel')" data-uid="${u.id}">
          <span class="uc ${u.type==='police'?'uc-p':u.type==='fire'?'uc-f':'uc-a'}">${u.id}</span><span>${u.name.substring(0,14)}</span>
        </div>`).join('')
      :'<p style="color:var(--txt2);font-size:9px;padding:5px 0;grid-column:1/-1">Aucune patrouille disponible</p>';
    window._pendingIncPos=pos;
    openModal('modal-inc');
  } else {
    document.getElementById('unit-pos-display').textContent=`${pos[0].toFixed(0)}, ${pos[1].toFixed(0)}`;
    document.getElementById('u-id').value=''; document.getElementById('u-name').value='';
    window._pendingUnitPos=pos;
    openModal('modal-unit');
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')cancelPlacing();});

// ── INCIDENT ──
async function createIncident(){
  if(window._renforcerInc){
    const incId=window._renforcerInc; window._renforcerInc=null;
    const sel=[...document.querySelectorAll('#f-units .ug-item.sel')].map(el=>el.dataset.uid);
    if(!sel.length){notify('Sélectionnez une patrouille','err');return;}
    const units=S.get('units')||[],incidents=S.get('incidents')||[];
    sel.forEach(uid=>{const u=units.find(x=>x.id===uid);if(u){u.status='dispatched';u.incident=incId;}});
    const inc=incidents.find(i=>i.id===incId);
    if(inc) inc.units=[...new Set([...inc.units,...sel])];
    S.set('units',units); S.set('incidents',incidents);
    closeIncModal(); renderMap();
    notify(`Renfort → ${incId}`,'warn');
    for(const uid of sel) await startDispatch(uid,incId);
    return;
  }
  const pos=window._pendingIncPos;
  if(!pos){notify('Position manquante','err');return;}
  const type=document.getElementById('f-type').value;
  const prio=parseInt(document.getElementById('f-prio').value);
  const desc=document.getElementById('f-desc').value||'—';
  const sel=[...document.querySelectorAll('#f-units .ug-item.sel')].map(el=>el.dataset.uid);
  const incidents=S.get('incidents')||[];
  const id='INC'+String(incidents.length+1).padStart(3,'0');
  incidents.push({id,type,priority:prio,desc,pos,status:sel.length?'active':'pending',units:sel,time:Date.now()});
  S.set('incidents',incidents);
  const units=S.get('units')||[];
  sel.forEach(uid=>{const u=units.find(x=>x.id===uid);if(u){u.status='dispatched';u.incident=id;}});
  S.set('units',units);
  if(placingMarker){map.removeLayer(placingMarker);placingMarker=null;}
  closeIncModal(); renderMap();
  map.flyTo(pos,1,{animate:true,duration:0.8});
  notify(`${id} — ${type}`,prio===1?'err':prio===2?'warn':'info');
  for(const uid of sel) await startDispatch(uid,id);
}
function closeIncModal(){
  window._renforcerInc=null; window._pendingIncPos=null;
  document.getElementById('inc-form-fields').style.display='';
  document.getElementById('btn-create-inc').textContent='CRÉER + DISPATCHER';
  closeModal('modal-inc');
}

// ── PATROUILLE ──
function createUnit(){
  const pos=window._pendingUnitPos;
  if(!pos){notify('Position manquante','err');return;}
  const id=document.getElementById('u-id').value.trim();
  const type=document.getElementById('u-type').value;
  const name=document.getElementById('u-name').value.trim()||id;
  if(!id){notify('Indicatif requis','err');return;}
  const units=S.get('units')||[];
  if(units.find(u=>u.id===id)){notify('Indicatif déjà utilisé','err');return;}
  units.push({id,name,type,status:'available',pos:[...pos],basePos:[...pos],incident:null});
  S.set('units',units);
  if(placingMarker){map.removeLayer(placingMarker);placingMarker=null;}
  closeModal('modal-unit'); renderMap();
  notify(`${id} ajouté`,'ok');
}

// ── ICÔNES ──
function uColor(u){return{police:'#3b9eff',fire:'#ff4040',ambulance:'#00d4a0'}[u.type]||'#fff';}
function makeUIcon(u,moving=false){
  const c=uColor(u);
  const lbl=u.id.length>7?u.id.slice(0,7):u.id;
  const dot=moving?`<div style="position:absolute;bottom:-2px;right:-2px;width:5px;height:5px;background:${c};border-radius:50%;animation:blink .5s infinite"></div>`:'';
  return L.divIcon({className:'',iconSize:[34,34],iconAnchor:[17,17],
    html:`<div style="position:relative;width:34px;height:34px;border-radius:4px;background:rgba(2,6,9,.95);border:${moving?'2px':'1px'} solid ${c};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:7px;color:${c};font-family:monospace;letter-spacing:.3px">${lbl}${dot}</div>`});
}
function makeIIcon(inc){
  const c={1:'#ff2020',2:'#ffb800',3:'#3b9eff'}[inc.priority];
  const sz=inc.priority===1?38:32;
  return L.divIcon({className:'',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],
    html:`<div ${inc.priority===1?'class="pulse-anim"':''} style="width:${sz}px;height:${sz}px;border-radius:4px;background:${c};display:flex;align-items:center;justify-content:center;font-weight:900;font-size:8px;color:${inc.priority===2?'#000':'#fff'};border:2px solid rgba(255,255,255,.85)">P${inc.priority}</div>`});
}

// ── RENDER ──
function renderMap(){
  const units=S.get('units')||[], incidents=S.get('incidents')||[];
  Object.values(uMarkers).forEach(m=>{try{map.removeLayer(m)}catch{}});
  Object.values(iMarkers).forEach(m=>{try{map.removeLayer(m)}catch{}});
  uMarkers={}; iMarkers={};

  units.forEach(u=>{
    if(filterType!=='all'&&u.type!==filterType) return;
    const moving=!!animations[u.id];
    const m=L.marker(u.pos,{icon:makeUIcon(u,moving),zIndexOffset:moving?200:0}).addTo(map);
    const sl={available:'Disponible',dispatched:'En intervention'}[u.status]||u.status;
    m.bindPopup(`<div style="min-width:150px">
      <b style="font-size:12px;color:#fff">${u.id}</b><br>
      <span style="color:#7a9ab0;font-size:9px">${u.name}</span>
      <hr style="border-color:#1c3048;margin:4px 0">
      <div style="font-size:10px;margin-bottom:3px">${sl}</div>
      ${u.incident?`<div style="font-size:9px;color:#ffb800">→ ${u.incident}</div>`:''}
      <div style="margin-top:7px">
        <button class="pp-btn" onclick="deleteUnit('${u.id}')" style="color:var(--red);border-color:var(--red)">Supprimer</button>
      </div>
    </div>`);
    uMarkers[u.id]=m;
  });

  incidents.forEach(inc=>{
    const closed=inc.status==='closed';
    const m=L.marker(inc.pos,{icon:makeIIcon(inc),zIndexOffset:closed?0:500,opacity:closed?0.4:1}).addTo(map);
    const elapsed=Math.floor((Date.now()-inc.time)/60000);
    const actionBtns=closed
      ?`<div style="margin-top:7px"><button class="pp-btn" onclick="deleteIncident('${inc.id}')" style="color:var(--red);border-color:var(--red);width:100%">Supprimer</button></div>`
      :`<div style="margin-top:7px;display:flex;gap:4px">
          <button class="pp-btn" onclick="openRenfort('${inc.id}')" style="color:#ffb800;border-color:#ffb800;flex:1">+ Renfort</button>
          <button class="pp-btn" onclick="closeIncident('${inc.id}')" style="color:var(--amb);border-color:var(--amb);flex:1">✓ Clôturer</button>
        </div>`;
    m.bindPopup(`<div style="min-width:165px">
      <div style="display:flex;align-items:center;gap:5px;margin-bottom:3px">
        <b style="font-size:11px;color:#fff">${inc.id}</b>
        ${closed?`<span style="font-size:7px;color:var(--amb);border:1px solid var(--amb);border-radius:2px;padding:1px 4px">CLÔTURÉ</span>`:''}
      </div>
      <span style="color:#ffb800;font-size:10px">${inc.type}</span>
      <hr style="border-color:#1c3048;margin:4px 0">
      <span style="font-size:9px;color:#7a9ab0">⏱ ${elapsed}min · ${inc.units.join(', ')||'Aucune'}</span>
      ${inc.desc!=='—'?`<div style="font-size:8px;color:#7a9ab0;margin-top:2px">${inc.desc}</div>`:''}
      ${actionBtns}
    </div>`);
    iMarkers[inc.id]=m;
  });

  renderSidebar(); updateStats();
}

function renderSidebar(){
  const units=S.get('units')||[], incidents=S.get('incidents')||[];
  const active=incidents.filter(i=>i.status!=='closed');
  document.getElementById('cnt-inc').textContent=active.length;
  document.getElementById('list-inc').innerHTML=active.length
    ?active.map(inc=>{
      const c={1:'var(--red)',2:'var(--gold)',3:'var(--police)'}[inc.priority];
      const elapsed=Math.floor((Date.now()-inc.time)/60000);
      return `<div class="sb-item" onclick="flyToInc('${inc.id}')">
        <div class="sb-dot" style="background:${c};box-shadow:0 0 4px ${c}"></div>
        <div class="sb-info"><div class="sb-name">${inc.type}</div><div class="sb-sub">${inc.id} · ${elapsed}min</div></div>
        <span class="sb-tag ${inc.status==='active'?'tag-dep':'tag-dispo'}">${inc.status==='active'?'ACTIF':'ATT.'}</span>
      </div>`;
    }).join('')
    :'<div class="sb-empty">Aucun incident actif</div>';

  const filt=filterType==='all'?units:units.filter(u=>u.type===filterType);
  document.getElementById('cnt-units').textContent=filt.length;
  document.getElementById('list-units').innerHTML=filt.length
    ?filt.map(u=>{
      const c=uColor(u); const moving=!!animations[u.id];
      const tag=moving?'tag-route':u.status==='available'?'tag-dispo':'tag-dep';
      return `<div class="sb-item" onclick="flyToUnit('${u.id}')">
        <div class="sb-dot" style="background:${c};box-shadow:0 0 4px ${c}"></div>
        <div class="sb-info"><div class="sb-name">${u.id} — ${u.name.substring(0,13)}</div><div class="sb-sub">${u.incident?'→ '+u.incident:'Disponible'}</div></div>
        <span class="sb-tag ${tag}">${moving?'ROUTE':u.status==='available'?'DISPO':'DEP.'}</span>
      </div>`;
    }).join('')
    :'<div class="sb-empty">Aucune patrouille</div>';
}

function updateStats(){
  const units=S.get('units')||[], incidents=S.get('incidents')||[];
  document.getElementById('st-active').textContent=incidents.filter(i=>i.status==='active').length;
  document.getElementById('st-dispo').textContent=units.filter(u=>u.status==='available').length;
  document.getElementById('st-route').textContent=Object.keys(animations).length;
  document.getElementById('nav-inc-badge').textContent=incidents.filter(i=>i.status!=='closed').length;
  document.getElementById('nav-pat-badge').textContent=units.length;
}

function flyToInc(id){
  const inc=(S.get('incidents')||[]).find(i=>i.id===id);
  if(!inc) return;
  map.flyTo(inc.pos,1,{animate:true,duration:0.9});
  setTimeout(()=>{if(iMarkers[id])iMarkers[id].openPopup();},1000);
}
function flyToUnit(id){
  const u=(S.get('units')||[]).find(u=>u.id===id);
  if(!u) return;
  map.flyTo(u.pos,1,{animate:true,duration:0.9});
  setTimeout(()=>{if(uMarkers[id])uMarkers[id].openPopup();},1000);
}
function setFilter(type,btn){
  filterType=type;
  document.querySelectorAll('.sf').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on'); renderMap();
}

// ── ACTIONS ──
function closeIncident(incId){
  const incidents=S.get('incidents')||[];
  const inc=incidents.find(i=>i.id===incId); if(!inc) return;
  inc.status='closed'; S.set('incidents',incidents);
  const units=S.get('units')||[];
  units.forEach(u=>{
    if(u.incident===incId){
      u.status='available'; u.incident=null;
      if(u.basePos) u.pos=[...u.basePos];
      if(animations[u.id]){delete animations[u.id];if(routeLines[u.id]){map.removeLayer(routeLines[u.id]);delete routeLines[u.id];}}
    }
  });
  S.set('units',units); map.closePopup(); renderMap();
  notify(`${incId} — Clôturé`,'ok');
}
function deleteIncident(incId){
  const incidents=S.get('incidents')||[];
  const idx=incidents.findIndex(i=>i.id===incId); if(idx===-1) return;
  incidents.splice(idx,1); S.set('incidents',incidents);
  if(iMarkers[incId]){map.removeLayer(iMarkers[incId]);delete iMarkers[incId];}
  map.closePopup(); renderMap(); notify(`${incId} — Supprimé`,'ok');
}
function deleteUnit(uid){
  if(!confirm(`Supprimer ${uid} ?`)) return;
  const units=S.get('units')||[];
  const idx=units.findIndex(u=>u.id===uid); if(idx===-1) return;
  units.splice(idx,1); S.set('units',units);
  if(animations[uid]) delete animations[uid];
  if(routeLines[uid]){map.removeLayer(routeLines[uid]);delete routeLines[uid];}
  if(uMarkers[uid]){map.removeLayer(uMarkers[uid]);delete uMarkers[uid];}
  map.closePopup(); renderMap(); notify(`${uid} — Supprimé`,'ok');
}
function openRenfort(incId){
  map.closePopup();
  const avail=(S.get('units')||[]).filter(u=>u.status==='available');
  if(!avail.length){notify('Aucune patrouille disponible','err');return;}
  document.getElementById('inc-modal-title').textContent='ENVOYER RENFORT';
  document.getElementById('inc-pos-display').textContent=`Renfort → ${incId}`;
  document.getElementById('inc-form-fields').style.display='none';
  document.getElementById('btn-create-inc').textContent='ENVOYER RENFORT';
  document.getElementById('f-units').innerHTML=avail.map(u=>`<div class="ug-item" onclick="this.classList.toggle('sel')" data-uid="${u.id}">
    <span class="uc ${u.type==='police'?'uc-p':u.type==='fire'?'uc-f':'uc-a'}">${u.id}</span><span>${u.name.substring(0,14)}</span>
  </div>`).join('');
  window._pendingIncPos=null; window._renforcerInc=incId;
  openModal('modal-inc');
}

// ── DISPATCH + ANIMATION ──
function buildPath(from,to,steps=180){
  const ctrl=[
    (from[0]+to[0])/2+(Math.random()-.5)*Math.abs(to[0]-from[0])*0.6,
    (from[1]+to[1])/2+(Math.random()-.5)*Math.abs(to[1]-from[1])*0.6
  ];
  const pts=[];
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    pts.push([
      (1-t)*(1-t)*from[0]+2*(1-t)*t*ctrl[0]+t*t*to[0],
      (1-t)*(1-t)*from[1]+2*(1-t)*t*ctrl[1]+t*t*to[1]
    ]);
  }
  return pts;
}
async function startDispatch(unitId,incidentId){
  const units=S.get('units')||[], incidents=S.get('incidents')||[];
  const u=units.find(x=>x.id===unitId);
  const inc=incidents.find(x=>x.id===incidentId);
  if(!u||!inc) return;
  notify(`${unitId} → En route`,'warn');
  const pts=buildPath(u.pos,inc.pos,180);
  if(routeLines[unitId]) map.removeLayer(routeLines[unitId]);
  routeLines[unitId]=L.polyline(pts,{color:uColor(u),weight:2,opacity:.65,dashArray:'8,5'}).addTo(map);
  const stepSize=Math.max(pts.length/350,0.04);
  animations[unitId]={pts,index:0,progress:0,stepSize,incidentId};
  updateStats();
}

setInterval(()=>{
  if(!Object.keys(animations).length) return;
  const units=S.get('units')||[]; let changed=false;
  Object.entries(animations).forEach(([uid,anim])=>{
    anim.progress+=anim.stepSize;
    while(anim.progress>=1&&anim.index<anim.pts.length-1){anim.progress-=1;anim.index++;}
    if(anim.index>=anim.pts.length-1){
      const u=units.find(x=>x.id===uid);
      if(u) u.pos=[...anim.pts[anim.pts.length-1]];
      delete animations[uid];
      if(routeLines[uid]){map.removeLayer(routeLines[uid]);delete routeLines[uid];}
      notify(`${uid} — Sur les lieux`,'ok');
      changed=true; return;
    }
    const from=anim.pts[anim.index],to=anim.pts[Math.min(anim.index+1,anim.pts.length-1)];
    const t=Math.min(anim.progress,1);
    const newPos=[from[0]+(to[0]-from[0])*t,from[1]+(to[1]-from[1])*t];
    const u=units.find(x=>x.id===uid);
    if(u) u.pos=newPos;
    if(uMarkers[uid]){uMarkers[uid].setLatLng(newPos);uMarkers[uid].setIcon(makeUIcon(u,true));}
    changed=true;
  });
  if(changed){S.set('units',units);updateStats();}
},100);

// ── MODALS ──
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-ov').forEach(el=>
  el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('open');})
);

// ── NOTIFS ──
function notify(msg,type='info'){
  const w=document.getElementById('notifs');
  const n=document.createElement('div');
  n.className=`notif n-${type}`; n.textContent=msg;
  w.appendChild(n); setTimeout(()=>n.remove(),5000);
}

// ── SYNC + BOOT ──
setInterval(()=>{
  const ts=parseInt(localStorage.getItem('gtav_ts')||0);
  if(ts>lastTs){lastTs=ts;renderSidebar();updateStats();}
},1000);

window.addEventListener('load',()=>{
  initData(); initMap(); renderMap();
  lastTs=parseInt(localStorage.getItem('gtav_ts')||0);
});
</script>
